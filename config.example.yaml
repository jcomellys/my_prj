# Voice Mac Agent — example configuration.
# Copy to config.yaml and edit. The active profile is selected at the top.

active_profile: free

profiles:

  # Tier 0 — fully local, $0 cost. EXPERIMENTAL (validated X-009, 2026-05-25).
  # Everything runs on the Mac: STT (whisper.cpp), brain (Ollama), TTS (say).
  # No API key, no spend.
  #
  # HONEST STATUS: qwen2.5:7b is NOT reliable for Mac control. In live tests
  # it sometimes called open_app correctly but often hallucinated (e.g. made
  # up the time instead of calling run_applescript) or returned AppleScript as
  # spoken text instead of invoking the tool — inconsistently across turns.
  # It IS fine for basic local Q&A in Spanish. Use this tier as a free,
  # best-effort option, not as the dependable accessibility experience — for
  # that use `cheap` (gpt-5-mini) or `manos_libres` (gpt-5). Revisit when
  # stronger local tool-calling models exist (qwen2.5:14b if it fits your M4,
  # or future releases).
  #
  # Prerequisites:
  #   brew install ollama && ollama serve   (in another terminal)
  #   ollama pull qwen2.5:7b                 (~4.7 GB; alt: llama3.1:8b)
  #   brew install sox whisper-cpp ; ~/.whisper-models/ggml-small.bin
  free:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          model_path: ~/.whisper-models/ggml-small.bin
          language: es
          silence_seconds: 1.5
          threshold: "3%"
          min_duration_seconds: 0.30
          leading_pad_seconds: 0.50
          trailing_pad_seconds: 0.20
          max_listen_seconds: 10
      tts:
        provider: macos_say
        voice: ""            # empty = system default. Try "Mónica" (es)
      cues:
        enabled: true
    brain:
      provider: ollama
      model: qwen2.5:7b      # alt: llama3.1:8b. Both support tool calling.
      temperature: 0.2
      max_tokens: 2048
    activator:
      kind: hotkey
      hotkey:
        combo: "ctrl+option+space"

  # Tier 1 — cheap cloud brain, local audio.
  cheap:
    voice:
      mode: pipeline
      stt:
        provider: stdin
      tts:
        provider: macos_say
    brain:
      provider: openai
      model: gpt-5-mini       # router barato: maneja lo simple
      temperature: 0.3
      max_tokens: 2048
      deep:                   # escala aquí solo cuando el barato lo decide
        provider: openai
        model: gpt-5
        max_tokens: 4096
    activator:
      kind: stdin

  # Tier 1b — Claude variant with aggressive prompt caching.
  cheap_claude:
    voice:
      mode: pipeline
      stt:
        provider: stdin
      tts:
        provider: macos_say
    brain:
      provider: anthropic
      model: claude-haiku-4-5  # router barato + cache_control sobre system+tools
      temperature: 0.3
      max_tokens: 2048
    activator:
      kind: stdin

  # Tier 1c — *voice* mode (Mac mic + whisper.cpp local + GPT-5).
  # Prerequisites on Mac:
  #   brew install sox whisper-cpp
  #   mkdir -p ~/.whisper-models
  #   curl -L -o ~/.whisper-models/ggml-small.bin \
  #     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
  # Grant Terminal microphone permission the first time the agent records.
  voice:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          model_path: ~/.whisper-models/ggml-small.bin
          # IMPORTANT: fija explícitamente el idioma. `auto` se equivoca con
          # frases cortas (<5 s). Cámbialo a "en" si tu idioma es inglés.
          language: es
          silence_seconds: 1.5          # stop recording after this much silence
          threshold: "3%"               # raise to 5-10% in noisy rooms
          min_duration_seconds: 0.30    # skip clips too short to be trusted
          leading_pad_seconds: 0.50     # helps Whisper keep the first word
          trailing_pad_seconds: 0.20
          max_listen_seconds: 10        # si activas y no hablas, se cierra solo
          initial_prompt: >
            Vocabulario frecuente para comandos de Mac en español. Verbos:
            abre, busca, léeme, lee, cierra, navega, escribe, describe.
            Aplicaciones y sitios: Google Chrome, Mensajes, Wikipedia,
            YouTube, Word. Objetos: pestaña, página, pantalla, párrafo,
            hora, gasto. Documentos: sección, introducción, resumen,
            conclusiones, resultados, métodos, referencias, documento.
            Frase típica: léeme la sección de la introducción, por favor.
      tts:
        provider: macos_say
      cues:
        enabled: true
        listening_sound: /System/Library/Sounds/Tink.aiff
        captured_sound: /System/Library/Sounds/Pop.aiff
    brain:
      provider: openai
      model: gpt-5
      temperature: 0
      max_tokens: 4096
    activator:
      kind: enter                       # press Enter to start each turn

  # Tier — manos libres: hotkey global ⌃⌥Espacio + voz + GPT-5.
  # El usuario presiona Ctrl+Option+Espacio en cualquier app,
  # habla, y el agente actúa. Ideal para personas sin manos
  # con un switch USB que mande esa combinación.
  manos_libres:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          # medium gana al small en nombres propios (A/B: 10/10 vs 7/10) con
          # latencia ~1.5s en M4, validado en smoke tests en vivo. Para una
          # máquina más lenta o menor disco, usa ggml-small.bin.
          model_path: ~/.whisper-models/ggml-medium.bin
          language: es
          silence_seconds: 1.5
          threshold: "3%"
          min_duration_seconds: 0.30
          leading_pad_seconds: 0.50
          trailing_pad_seconds: 0.20
          max_listen_seconds: 10        # si activas y no hablas, se cierra solo
          initial_prompt: >
            Vocabulario frecuente para comandos de Mac en español. Verbos:
            abre, busca, léeme, lee, cierra, navega, escribe, describe.
            Aplicaciones y sitios: Google Chrome, Mensajes, Wikipedia,
            YouTube, Word. Objetos: pestaña, página, pantalla, párrafo,
            hora, gasto.
      tts:
        # VOZ NATURAL tipo app de Claude/ChatGPT (premium, usa tu OPENAI_API_KEY):
        # cambia provider a openai_tts. Cuesta fracciones de centavo por frase
        # y si la red falla cae solo a la voz local (nunca se queda mudo).
        #   provider: openai_tts
        #   model: gpt-4o-mini-tts   # default
        #   voice: marin             # alt: cedar, nova, alloy...
        #   speed: 1.0
        provider: macos_say
        # Voz: las voces "compacta" por defecto suenan robóticas. Para una voz
        # natural, instala una voz Enhanced/Premium en español:
        #   System Settings → Accessibility → Spoken Content → System Voice →
        #   Manage Voices → descarga "Mónica (Enhanced)" o "Paulina (Enhanced)".
        # Luego pon aquí su nombre exacto. Si la voz no existe, el agente cae
        # de vuelta a la voz por defecto en vez de quedarse mudo.
        voice: "Mónica"
        rate: 180            # palabras/min; vacío o 0 = ritmo del sistema
      # Earcons de accesibilidad: sonido al abrir y al cerrar el micrófono.
      # Encendidos por defecto. Imprescindibles para usuarios que no ven la
      # pantalla: marcan "habla ahora" y "te escuché, procesando".
      cues:
        enabled: true
        listening_sound: /System/Library/Sounds/Tink.aiff
        captured_sound: /System/Library/Sounds/Pop.aiff
    brain:
      provider: openai
      model: gpt-5
      temperature: 0
      max_tokens: 4096
      # Velocidad de respuesta para voz: gpt-5 razona en "medium" por defecto,
      # lo que tarda ~1 min por turno (demasiado para manos libres). "low" da
      # respuestas rápidas conservando buena calidad; prueba "minimal" si
      # quieres aún más velocidad en comandos simples. Para razonamiento
      # profundo, delega al sub-agente (que puede usar más esfuerzo).
      reasoning_effort: low
      # Cerebro RÁPIDO para los fast-paths ("léeme la sección X"): cuando Go
      # ya ejecutó la tool, lo que queda es traducir/narrar un extracto — no
      # necesita gpt-5. Medido en vivo (X-017): la vuelta de respuesta tardaba
      # 5.6s en gpt-5; gpt-5-mini con reasoning minimal apunta a ~1-2s.
      # TRADEOFF: traducción/narración de un extracto corto es tarea simple y
      # gpt-5-mini la hace bien; si alguna vez la calidad no alcanza, el
      # modelo puede escalar solo (tool escalate) o puedes borrar este bloque
      # para volver a gpt-5 en todos los turnos.
      fast:
        provider: openai
        model: gpt-5-mini
        temperature: 0
        max_tokens: 2048
        reasoning_effort: minimal
    activator:
      kind: hotkey
      hotkey:
        combo: "ctrl+option+space"

  # Tier — USB como interruptor físico.
  usb_switch:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          model_path: ~/.whisper-models/ggml-small.bin
          language: es
      tts:
        provider: macos_say
    brain:
      provider: openai
      model: gpt-5
      max_tokens: 4096
    activator:
      kind: usb_presence
      usb:
        volume_name: AGENT

  # Tier 2 — premium cloud everything (default for paying users).
  premium:
    voice:
      mode: pipeline
      stt:
        provider: stdin      # whisper.cpp en fase 0.2; openai_realtime en fase 1
      tts:
        provider: macos_say
    brain:
      provider: openai
      model: gpt-5
      # NOTE: GPT-5 y la familia o-series solo aceptan temperature default (1).
      # El código descarta valores != 1 automáticamente para estos modelos,
      # así que puedes dejar este campo en 0 / omitirlo sin problema.
      temperature: 0
      max_tokens: 4096
    activator:
      kind: stdin

# Tool permissions. The user grants per-tool. Listed here for transparency.
tools:
  shell:
    enabled: true
    allow_unrestricted: false   # if false, only commands in shell.allowlist run unprompted
    allowlist:
      - "open "
      - "osascript "
  open_app:
    enabled: true
  applescript:
    enabled: true
  screenshot:
    enabled: true   # captura pantalla; pide permiso de Screen Recording la 1ª vez
  delegate:
    enabled: true   # sub-agente para tareas grandes (delegate_task). Usa el
                    # cerebro profundo si existe, o el principal. El sub-agente
                    # hereda shell con la MISMA allowlist + read_file/write_file.
                    # Para que pueda ejecutar/compilar de verdad, amplía la
                    # allowlist de shell o pon allow_unrestricted: true (con cuidado).

# Cost tracking — stored locally in cost.db (SQLite). Shown on demand.
cost:
  enabled: true
  monthly_budget_usd: 0       # 0 = no limit; otherwise hard-stop when exceeded
  warn_at_pct: 80
  # Los precios de los modelos cambian. La tabla integrada es orientativa;
  # sobreescríbela aquí (USD por 1M de tokens) para mantener el costo honesto
  # sin recompilar. La clave es provider:model, o "provider:" para todo el
  # proveedor. Ejemplo:
  # pricing:
  #   "openai:gpt-5":      { input_per_1m: 5.00, output_per_1m: 20.00, cached_input_per_1m: 0.50 }
  #   "openai:gpt-5-mini": { input_per_1m: 0.25, output_per_1m: 1.00,  cached_input_per_1m: 0.025 }
