# Voice Mac Agent — example configuration.
# Copy to config.yaml and edit. The active profile is selected at the top.

active_profile: free

profiles:

  # Tier 0 — fully local, $0 cost.
  # Brain runs on your Mac via Ollama. STT/TTS local.
  free:
    voice:
      mode: pipeline
      stt:
        provider: stdin      # placeholder until whisper.cpp is wired in fase 0.2
      tts:
        provider: macos_say  # native macOS voices (Tahoe has excellent ones)
        voice: ""            # empty = system default. Try "Mónica" (es) or "Samantha" (en)
        rate: 200            # words per minute
    brain:
      provider: ollama
      model: llama3.3:8b     # cabe holgado en M4. Cambiar a qwen2.5:14b para mejor razonamiento
      temperature: 0.3
      max_tokens: 2048
    activator:
      kind: stdin            # press Enter to activate. hotkey global llega en fase 0.3

  # Tier 1 — cheap cloud brain, local audio.
  cheap:
    voice:
      mode: pipeline
      stt:
        provider: stdin
      tts:
        provider: macos_say
    brain:
      provider: openai
      model: gpt-5-mini      # router barato. Escala a gpt-5 cuando hace falta
      temperature: 0.3
      max_tokens: 2048
    activator:
      kind: stdin

  # Tier 1b — Claude variant with aggressive prompt caching.
  cheap_claude:
    voice:
      mode: pipeline
      stt:
        provider: stdin
      tts:
        provider: macos_say
    brain:
      provider: anthropic
      model: claude-haiku-4-5  # router barato + cache_control sobre system+tools
      temperature: 0.3
      max_tokens: 2048
    activator:
      kind: stdin

  # Tier 1c — *voice* mode (Mac mic + whisper.cpp local + GPT-5).
  # Prerequisites on Mac:
  #   brew install sox whisper-cpp
  #   mkdir -p ~/.whisper-models
  #   curl -L -o ~/.whisper-models/ggml-small.bin \
  #     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
  # Grant Terminal microphone permission the first time the agent records.
  voice:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          model_path: ~/.whisper-models/ggml-small.bin
          # IMPORTANT: fija explícitamente el idioma. `auto` se equivoca con
          # frases cortas (<5 s). Cámbialo a "en" si tu idioma es inglés.
          language: es
          silence_seconds: 1.5          # stop recording after this much silence
          threshold: "3%"               # raise to 5-10% in noisy rooms
          min_duration_seconds: 0.30    # skip clips too short to be trusted
          leading_pad_seconds: 0.50     # helps Whisper keep the first word
          trailing_pad_seconds: 0.20
          max_listen_seconds: 10        # si activas y no hablas, se cierra solo
          initial_prompt: >
            Vocabulario frecuente para comandos de Mac en español. Verbos:
            abre, busca, léeme, lee, cierra, navega, escribe, describe.
            Aplicaciones y sitios: Google Chrome, Mensajes, Wikipedia,
            YouTube, Word. Objetos: pestaña, página, pantalla, párrafo,
            hora, gasto.
      tts:
        provider: macos_say
      cues:
        enabled: true
        listening_sound: /System/Library/Sounds/Tink.aiff
        captured_sound: /System/Library/Sounds/Pop.aiff
    brain:
      provider: openai
      model: gpt-5
      temperature: 0
      max_tokens: 4096
    activator:
      kind: enter                       # press Enter to start each turn

  # Tier — manos libres: hotkey global ⌃⌥Espacio + voz + GPT-5.
  # El usuario presiona Ctrl+Option+Espacio en cualquier app,
  # habla, y el agente actúa. Ideal para personas sin manos
  # con un switch USB que mande esa combinación.
  manos_libres:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          model_path: ~/.whisper-models/ggml-small.bin
          language: es
          silence_seconds: 1.5
          threshold: "3%"
          min_duration_seconds: 0.30
          leading_pad_seconds: 0.50
          trailing_pad_seconds: 0.20
          max_listen_seconds: 10        # si activas y no hablas, se cierra solo
          initial_prompt: >
            Vocabulario frecuente para comandos de Mac en español. Verbos:
            abre, busca, léeme, lee, cierra, navega, escribe, describe.
            Aplicaciones y sitios: Google Chrome, Mensajes, Wikipedia,
            YouTube, Word. Objetos: pestaña, página, pantalla, párrafo,
            hora, gasto.
      tts:
        provider: macos_say
      # Earcons de accesibilidad: sonido al abrir y al cerrar el micrófono.
      # Encendidos por defecto. Imprescindibles para usuarios que no ven la
      # pantalla: marcan "habla ahora" y "te escuché, procesando".
      cues:
        enabled: true
        listening_sound: /System/Library/Sounds/Tink.aiff
        captured_sound: /System/Library/Sounds/Pop.aiff
    brain:
      provider: openai
      model: gpt-5
      temperature: 0
      max_tokens: 4096
    activator:
      kind: hotkey
      hotkey:
        combo: "ctrl+option+space"

  # Tier — USB como interruptor físico.
  usb_switch:
    voice:
      mode: pipeline
      stt:
        provider: whisper_cpp
        whisper:
          model_path: ~/.whisper-models/ggml-small.bin
          language: es
      tts:
        provider: macos_say
    brain:
      provider: openai
      model: gpt-5
      max_tokens: 4096
    activator:
      kind: usb_presence
      usb:
        volume_name: AGENT

  # Tier 2 — premium cloud everything (default for paying users).
  premium:
    voice:
      mode: pipeline
      stt:
        provider: stdin      # whisper.cpp en fase 0.2; openai_realtime en fase 1
      tts:
        provider: macos_say
    brain:
      provider: openai
      model: gpt-5
      # NOTE: GPT-5 y la familia o-series solo aceptan temperature default (1).
      # El código descarta valores != 1 automáticamente para estos modelos,
      # así que puedes dejar este campo en 0 / omitirlo sin problema.
      temperature: 0
      max_tokens: 4096
    activator:
      kind: stdin

# Tool permissions. The user grants per-tool. Listed here for transparency.
tools:
  shell:
    enabled: true
    allow_unrestricted: false   # if false, only commands in shell.allowlist run unprompted
    allowlist:
      - "open "
      - "osascript "
  open_app:
    enabled: true
  applescript:
    enabled: true
  screenshot:
    enabled: true   # captura pantalla; pide permiso de Screen Recording la 1ª vez

# Cost tracking — stored locally in cost.db (SQLite). Shown on demand.
cost:
  enabled: true
  monthly_budget_usd: 0       # 0 = no limit; otherwise hard-stop when exceeded
  warn_at_pct: 80
